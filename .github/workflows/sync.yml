name: Sync GHL data

# Keeps the Supabase mirror (contacts + opportunities) current for anything
# that changes on the GHL side without going through the portal — e.g. a
# pipeline stage moved directly in GHL. Portal -> GHL changes (dragging a
# card, editing a field) already write straight through to the GHL API and
# need no polling. Contact assignment also has its own instant GHL Workflow
# webhook; this is the safety-net catch-all, running every 5 minutes.

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch: {}

jobs:
  backfill:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger portal backfill
        run: |
          curl -sf -X POST "https://prolific-wealth-portal-xi.vercel.app/api/admin/backfill?secret=${{ secrets.ADMIN_BACKFILL_SECRET }}" \
            --max-time 90
